[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "arxiv-downloader"
version = "0.1.0"
description = "A0 daemon and CLI for durable, verified arXiv PDF downloads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.32,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
arxivctl = "arxiv_downloader.cli.app:app"
arxivd = "arxiv_downloader.daemon.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_downloader"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE"]
ignore = [
  "B008",  # FastAPI Depends and Typer Option intentionally use call defaults.
  "BLE001",  # Health probes and worker isolation must contain unexpected failures.
]
