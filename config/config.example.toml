[server]
host = "127.0.0.1"
port = 8765

[database]
# SQLite is the A0 default. Set ARXIV_DATABASE_URL to a PostgreSQL URL to
# override this value without changing the configuration file.
dsn_env = "ARXIV_DATABASE_URL"
url = "sqlite+aiosqlite:////var/lib/arxiv-downloader/arxiv.db"

[download]
concurrency = 2
request_timeout_seconds = 120
max_attempts = 4
max_file_size_mb = 200
min_request_interval_seconds = 3
user_agent = "arxiv-downloader-a0/0.1 contact@example.com"
resume_downloads = true
checkpoint_interval_bytes = 8388608
checkpoint_interval_seconds = 15
retry_base_delay_seconds = 5
retry_max_delay_seconds = 300

[storage]
mode = "mounted"
mount_root = "/mnt"
data_root = "/mnt/arxiv"
staging_root = "/var/cache/arxiv-downloader"
sentinel_file = "/mnt/arxiv/.mount_sentinel"
staging_min_free_bytes = 10737418240
staging_min_free_percent = 15
data_min_free_bytes = 536870912000
data_min_free_percent = 10
